spring.application.name=collaboration-server
server.port=${APIVOY_COLLAB_PORT:8088}
spring.datasource.url=${APIVOY_COLLAB_DATABASE_URL:jdbc:h2:file:./data/apivoy-collaboration;AUTO_SERVER=TRUE}
spring.datasource.username=${APIVOY_COLLAB_DATABASE_USER:sa}
spring.datasource.password=${APIVOY_COLLAB_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
server.error.include-message=always
apivoy.bootstrap-token=${APIVOY_COLLAB_BOOTSTRAP_TOKEN:change-me-before-production}
apivoy.allowed-origins=${APIVOY_COLLAB_ALLOWED_ORIGINS:http://localhost:5180,http://127.0.0.1:5180,tauri://localhost,http://tauri.localhost}
apivoy.sso.enabled=${APIVOY_COLLAB_SSO_ENABLED:false}
apivoy.sso.organization-id=${APIVOY_COLLAB_SSO_ORGANIZATION_ID:}
apivoy.sso.default-role=${APIVOY_COLLAB_SSO_DEFAULT_ROLE:VIEWER}
apivoy.sso.web-redirect=${APIVOY_COLLAB_SSO_WEB_REDIRECT:http://localhost:5180}
spring.security.oauth2.client.registration.oidc.client-id=${APIVOY_COLLAB_OIDC_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.oidc.client-secret=${APIVOY_COLLAB_OIDC_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.oidc.authorization-uri=${APIVOY_COLLAB_OIDC_AUTHORIZATION_URI:https://invalid.local/authorize}
spring.security.oauth2.client.provider.oidc.token-uri=${APIVOY_COLLAB_OIDC_TOKEN_URI:https://invalid.local/token}
spring.security.oauth2.client.provider.oidc.jwk-set-uri=${APIVOY_COLLAB_OIDC_JWK_SET_URI:https://invalid.local/jwks}
spring.security.oauth2.client.provider.oidc.user-info-uri=${APIVOY_COLLAB_OIDC_USER_INFO_URI:https://invalid.local/userinfo}
spring.security.oauth2.client.provider.oidc.user-name-attribute=sub
