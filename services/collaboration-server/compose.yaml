services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apivoy
      POSTGRES_USER: apivoy
      POSTGRES_PASSWORD: ${APIVOY_COLLAB_DATABASE_PASSWORD:?set APIVOY_COLLAB_DATABASE_PASSWORD}
    volumes:
      - apivoy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apivoy"]
      interval: 5s
      timeout: 3s
      retries: 10
  collaboration:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8088:8088"]
    environment:
      APIVOY_COLLAB_DATABASE_URL: jdbc:postgresql://postgres:5432/apivoy
      APIVOY_COLLAB_DATABASE_USER: apivoy
      APIVOY_COLLAB_DATABASE_PASSWORD: ${APIVOY_COLLAB_DATABASE_PASSWORD}
      APIVOY_COLLAB_BOOTSTRAP_TOKEN: ${APIVOY_COLLAB_BOOTSTRAP_TOKEN:?set APIVOY_COLLAB_BOOTSTRAP_TOKEN}
      APIVOY_COLLAB_SSO_ENABLED: ${APIVOY_COLLAB_SSO_ENABLED:-false}
      APIVOY_COLLAB_SSO_ORGANIZATION_ID: ${APIVOY_COLLAB_SSO_ORGANIZATION_ID:-}
      APIVOY_COLLAB_SSO_WEB_REDIRECT: ${APIVOY_COLLAB_SSO_WEB_REDIRECT:-http://localhost:5180}
      APIVOY_COLLAB_OIDC_CLIENT_ID: ${APIVOY_COLLAB_OIDC_CLIENT_ID:-disabled}
      APIVOY_COLLAB_OIDC_CLIENT_SECRET: ${APIVOY_COLLAB_OIDC_CLIENT_SECRET:-disabled}
      APIVOY_COLLAB_OIDC_AUTHORIZATION_URI: ${APIVOY_COLLAB_OIDC_AUTHORIZATION_URI:-https://invalid.local/authorize}
      APIVOY_COLLAB_OIDC_TOKEN_URI: ${APIVOY_COLLAB_OIDC_TOKEN_URI:-https://invalid.local/token}
      APIVOY_COLLAB_OIDC_JWK_SET_URI: ${APIVOY_COLLAB_OIDC_JWK_SET_URI:-https://invalid.local/jwks}
      APIVOY_COLLAB_OIDC_USER_INFO_URI: ${APIVOY_COLLAB_OIDC_USER_INFO_URI:-https://invalid.local/userinfo}
volumes:
  apivoy-postgres:
