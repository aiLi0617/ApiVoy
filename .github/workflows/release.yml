name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Ensure Tauri frontendDist exists for workspace Cargo
        run: mkdir -p apps/desktop/dist && test -f apps/desktop/dist/index.html || printf '%s\n' '<!doctype html><title>ApiVoy</title>' > apps/desktop/dist/index.html
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  prepare-release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release notes
        id: release-notes
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          NOTES_FILE=".github/release-notes/alpha.md"
          VERSION="${TAG#v}"
          CHANGELOG_SECTION="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { in_section = 1 }
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" v "\\]" { exit }
            in_section { print }
          ' CHANGELOG.md || true)"
          if [ -f "$NOTES_FILE" ]; then
            BODY="$(cat "$NOTES_FILE")"
          elif [ -n "$CHANGELOG_SECTION" ]; then
            BODY="$CHANGELOG_SECTION"
          else
            BODY="ApiVoy ${TAG}"
          fi
          printf '%s\n' "$BODY" > /tmp/release-notes.md
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 8
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=true --prerelease=false --title "ApiVoy ${RELEASE_TAG}" --notes-file /tmp/release-notes.md
            else
              gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft --title "ApiVoy ${RELEASE_TAG}" --notes-file /tmp/release-notes.md
            fi

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-14
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      ESBUILD_WORKER_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:sidecar
      - name: Build desktop installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.sidecar.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  agent-cli:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            ext: tar.gz
          - os: macos-14
            platform: macos-arm64
            ext: tar.gz
          - os: windows-2025
            platform: windows-x64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p apivoy-local-agent -p apivoy-cli
      - name: Package CLI and Agent
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGING="dist/apivoy-tools-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGING"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/apivoy-agent.exe "$STAGING/apivoy-agent.exe"
            cp target/release/apivoy-cli.exe "$STAGING/apivoy-cli.exe"
          else
            cp target/release/apivoy-agent "$STAGING/apivoy-agent"
            cp target/release/apivoy-cli "$STAGING/apivoy-cli"
            chmod +x "$STAGING"/*
          fi
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && powershell Compress-Archive -Path "apivoy-tools-${VERSION}-${{ matrix.platform }}" -DestinationPath "apivoy-tools-${VERSION}-${{ matrix.platform }}.zip")
          else
            tar -C dist -czf "dist/apivoy-tools-${VERSION}-${{ matrix.platform }}.tar.gz" "apivoy-tools-${VERSION}-${{ matrix.platform }}"
          fi
          rm -rf "$STAGING"
      - uses: actions/upload-artifact@v7
        with:
          name: apivoy-tools-${{ matrix.platform }}
          path: |
            dist/apivoy-tools-*.zip
            dist/apivoy-tools-*.tar.gz

  publish:
    name: Attach release assets
    needs: [prepare-release, desktop, agent-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 8
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            shopt -s nullglob globstar
            files=()
            for path in artifacts/**/*; do
              if [ -f "$path" ]; then
                files+=("$path")
              fi
            done
            if [ ${#files[@]} -eq 0 ]; then
              echo "No release assets found" >&2
              find artifacts -print || true
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
      - name: Generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 8
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            mkdir -p checksums
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir checksums --clobber
            (
              cd checksums
              shopt -s nullglob
              for file in *; do
                if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
                  sha256sum "$file"
                fi
              done
            ) > checksums/SHA256SUMS.txt
            cat checksums/SHA256SUMS.txt
            gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" checksums/SHA256SUMS.txt --clobber
      - name: Keep release as draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 8
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=true --prerelease=false
            echo "Release ${RELEASE_TAG} remains a Draft release. Download, verify SHA256SUMS.txt, then publish manually from GitHub."
