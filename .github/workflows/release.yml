name: Release

on:
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-14
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:sidecar
      - name: Resolve release notes
        id: release-notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=".github/release-notes/alpha.md"
          if [ -f "$NOTES_FILE" ]; then
            BODY="$(cat "$NOTES_FILE")"
          else
            BODY="$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              --jq '.body')"
          fi
          if [ -z "$BODY" ]; then
            BODY="ApiVoy ${TAG}"
          fi
          DELIM="RELEASE_NOTES_$(date +%s%N)"
          {
            echo "body<<$DELIM"
            printf '%s\n' "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.sidecar.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: ApiVoy ${{ github.ref_name }}
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true

  agent-cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            ext: tar.gz
          - os: macos-14
            platform: macos-arm64
            ext: tar.gz
          - os: windows-2025
            platform: windows-x64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p apivoy-local-agent -p apivoy-cli
      - name: Package CLI and Agent
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          STAGING="dist/apivoy-tools-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGING"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/apivoy-agent.exe "$STAGING/apivoy-agent.exe"
            cp target/release/apivoy-cli.exe "$STAGING/apivoy-cli.exe"
          else
            cp target/release/apivoy-agent "$STAGING/apivoy-agent"
            cp target/release/apivoy-cli "$STAGING/apivoy-cli"
            chmod +x "$STAGING"/*
          fi
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && powershell Compress-Archive -Path "apivoy-tools-${VERSION}-${{ matrix.platform }}" -DestinationPath "apivoy-tools-${VERSION}-${{ matrix.platform }}.zip")
          else
            tar -C dist -czf "dist/apivoy-tools-${VERSION}-${{ matrix.platform }}.tar.gz" "apivoy-tools-${VERSION}-${{ matrix.platform }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apivoy-tools-${{ matrix.platform }}
          path: dist/apivoy-tools-*

  publish:
    name: Publish release
    needs: [desktop, agent-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: apivoy-tools-*
          merge-multiple: true
      - name: Upload CLI and Agent archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/apivoy-tools-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tool archives found" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${files[@]}"
      - name: Generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir checksums
          (
            cd checksums
            shopt -s nullglob
            for file in *; do
              if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
                sha256sum "$file"
              fi
            done
          ) > checksums/SHA256SUMS.txt
          cat checksums/SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" checksums/SHA256SUMS.txt --clobber
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
