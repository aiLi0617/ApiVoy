name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Ensure Tauri frontendDist exists for workspace Cargo
        run: mkdir -p apps/desktop/dist && test -f apps/desktop/dist/index.html || printf '%s\n' '<!doctype html><title>ApiVoy</title>' > apps/desktop/dist/index.html
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-14
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:sidecar
      - name: Resolve release notes
        id: release-notes
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          NOTES_FILE=".github/release-notes/alpha.md"
          CHANGELOG_SECTION="$(awk '/^## \[0\.1\.0-alpha\.1\]/,/^## \[/{if ($0 ~ /^## \[/ && $0 !~ /0\.1\.0-alpha\.1/) exit; print}' CHANGELOG.md || true)"
          if [ -f "$NOTES_FILE" ]; then
            BODY="$(cat "$NOTES_FILE")"
          elif [ -n "$CHANGELOG_SECTION" ]; then
            BODY="$CHANGELOG_SECTION"
          else
            BODY="ApiVoy ${TAG}"
          fi
          DELIM="RELEASE_NOTES_$(date +%s%N)"
          {
            echo "body<<$DELIM"
            printf '%s\n' "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.sidecar.conf.json
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ApiVoy ${{ env.RELEASE_TAG }} — First Public Alpha
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true

  agent-cli:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            ext: tar.gz
          - os: macos-14
            platform: macos-arm64
            ext: tar.gz
          - os: windows-2025
            platform: windows-x64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p apivoy-local-agent -p apivoy-cli
      - name: Package CLI and Agent
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          STAGING="dist/apivoy-tools-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$STAGING"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/apivoy-agent.exe "$STAGING/apivoy-agent.exe"
            cp target/release/apivoy-cli.exe "$STAGING/apivoy-cli.exe"
          else
            cp target/release/apivoy-agent "$STAGING/apivoy-agent"
            cp target/release/apivoy-cli "$STAGING/apivoy-cli"
            chmod +x "$STAGING"/*
          fi
          mkdir -p dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && powershell Compress-Archive -Path "apivoy-tools-${VERSION}-${{ matrix.platform }}" -DestinationPath "apivoy-tools-${VERSION}-${{ matrix.platform }}.zip")
          else
            tar -C dist -czf "dist/apivoy-tools-${VERSION}-${{ matrix.platform }}.tar.gz" "apivoy-tools-${VERSION}-${{ matrix.platform }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: apivoy-tools-${{ matrix.platform }}
          path: dist/apivoy-tools-*

  publish:
    name: Attach release assets
    needs: [desktop, agent-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: apivoy-tools-*
          merge-multiple: true
      - name: Upload CLI and Agent archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/apivoy-tools-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tool archives found" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" "${files[@]}"
      - name: Generate SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p checksums
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir checksums
          (
            cd checksums
            shopt -s nullglob
            for file in *; do
              if [ -f "$file" ] && [ "$file" != "SHA256SUMS.txt" ]; then
                sha256sum "$file"
              fi
            done
          ) > checksums/SHA256SUMS.txt
          cat checksums/SHA256SUMS.txt
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" checksums/SHA256SUMS.txt --clobber
      - name: Keep release as draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=true --prerelease=true
          echo "Release ${RELEASE_TAG} remains a Draft pre-release. Download, verify SHA256SUMS.txt, then publish manually from GitHub."
