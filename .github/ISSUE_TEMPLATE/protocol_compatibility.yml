name: Protocol compatibility
description: Report protocol-specific behavior against a server or broker
title: "[Protocol] "
labels:
  - protocol
body:
  - type: markdown
    attributes:
      value: |
        Remove API keys, tokens, cookies, certificates, and private endpoints
        before submitting logs, captures, or screenshots.
  - type: input
    id: version
    attributes:
      label: ApiVoy version
    validations:
      required: true
  - type: input
    id: protocol
    attributes:
      label: Protocol type
      placeholder: e.g. gRPC, MQTT 3.1.1, AMQP 0-9-1
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server implementation and version
      placeholder: e.g. Mosquitto 2.0, RabbitMQ 3.13, grpc-go
    validations:
      required: true
  - type: input
    id: tls
    attributes:
      label: TLS / authentication
      placeholder: e.g. mTLS, SASL PLAIN, Bearer token via secret_ref
  - type: textarea
    id: request
    attributes:
      label: Request description
      description: Method, headers, payload shape, or subscription details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Packet capture or logs
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps, docker compose snippet, or link to a minimal project.
