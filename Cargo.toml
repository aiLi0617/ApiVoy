[workspace]
resolver = "2"
members = [
  "crates/core-domain",
  "crates/event-stream",
  "crates/secret-store",
  "crates/execution-engine",
  "crates/driver-http",
  "apps/desktop/src-tauri",
  "apps/local-agent",
  "apps/cli",
]
default-members = [
  "crates/core-domain",
  "crates/execution-engine",
  "crates/driver-http",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ApiVoy Contributors"]
repository = "https://github.com/apivoy/apivoy"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

# Internal crates
core-domain = { path = "crates/core-domain" }
event-stream = { path = "crates/event-stream" }
secret-store = { path = "crates/secret-store" }
execution-engine = { path = "crates/execution-engine" }
driver-http = { path = "crates/driver-http" }

[profile.release]
lto = true
codegen-units = 1
strip = true
