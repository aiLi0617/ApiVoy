[package]
name = "driver-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Built-in PostgreSQL, MySQL and SQLite query driver"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
core-domain = { workspace = true }
event-stream = { workspace = true }
execution-engine = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "mysql", "sqlite", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
url = "2"
