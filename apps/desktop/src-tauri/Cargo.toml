[package]
name = "apivoy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ApiVoy desktop shell (Tauri 2)"

[[bin]]
name = "apivoy"
path = "src/main.rs"

[lib]
name = "apivoy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
capture-proxy = { workspace = true }
core-domain = { workspace = true }
driver-http = { workspace = true }
driver-sse = { workspace = true }
driver-tcp-udp = { workspace = true }
driver-graphql = { workspace = true }
driver-websocket = { workspace = true }
driver-grpc = { workspace = true }
driver-rpc-http = { workspace = true }
driver-redis = { workspace = true }
driver-mqtt = { workspace = true }
driver-amqp = { workspace = true }
driver-kafka = { workspace = true }
driver-sql = { workspace = true }
execution-engine = { workspace = true }
local-store = { workspace = true }
plugin-runtime = { workspace = true }
secret-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
uuid = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
