[package]
name = "apivoy-local-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ApiVoy Local Agent — Web → Rust core bridge"

[[bin]]
name = "apivoy-agent"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = { workspace = true }
chrono = { workspace = true }
capture-proxy = { workspace = true }
core-domain = { workspace = true }
driver-http = { workspace = true }
driver-sse = { workspace = true }
driver-tcp-udp = { workspace = true }
driver-graphql = { workspace = true }
driver-websocket = { workspace = true }
driver-grpc = { workspace = true }
driver-rpc-http = { workspace = true }
driver-redis = { workspace = true }
driver-mqtt = { workspace = true }
driver-amqp = { workspace = true }
execution-engine = { workspace = true }
futures = { workspace = true }
local-store = { workspace = true }
plugin-runtime = { workspace = true }
secret-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
